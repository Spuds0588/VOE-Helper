<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOE Helper — WVOE</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 640px; margin: 40px auto; padding: 0 16px; color: #1f2937; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 600; color: #6b7280; margin: 0 0 16px; }
  .hint { font-size: 12px; color: #6b7280; margin-bottom: 16px; }
  .btn-main {
    display: inline-block; background: #2563eb; color: #fff; border: 1px solid #1d4ed8;
    padding: 8px 16px; border-radius: 5px; font-weight: 600; font-size: 13px;
    cursor: pointer;
  }
  .btn-main:hover { background: #1d4ed8; }
  .btn-main:disabled { background: #9ca3af; border-color: #6b7280; cursor: wait; }
  #status { margin-left: 12px; font-size: 12px; color: #6b7280; font-weight: 500; }
  #status[data-state="error"] { color: #b91c1c; }
  #status[data-state="ok"] { color: #15803d; }
</style>
</head>
<body>
  <h1>Written VOE (WVOE) generator</h1>
  <h2>VOE Helper — phase 2, milestone M1 spike</h2>
  <p class="hint">
    Fills the bundled WVOE template with hardcoded values (Walmart / The Work
    Number 10108) and downloads the result — entirely client-side via the vendored
    <code>@pdfme/generator</code> bundle. No network access, no uploads.
  </p>
  <button class="btn-main" id="generate">Generate WVOE Form</button>
  <span id="status" data-state="idle">idle</span>

  <script src="vendor/pdfme-generator.iife.min.js"></script>
  <script src="wvoe.js"></script>
</body>
</html>
