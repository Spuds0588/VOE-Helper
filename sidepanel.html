<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOE Helper — WVOE</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 12px; color: #1f2937; font-size: 13px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  h2 { font-size: 12px; font-weight: 500; color: #6b7280; margin: 0 0 12px; line-height: 1.45; }
  label { display: block; font-size: 11px; font-weight: 600; color: #4b5563; margin: 7px 0 2px; }
  input, textarea {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 13px;
    border: 1px solid #d1d5db; border-radius: 4px; padding: 5px 7px; color: #1f2937;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus { outline: 1px solid #2563eb; border-color: #2563eb; }
  .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn-main {
    display: inline-block; background: #2563eb; color: #fff; border: 1px solid #1d4ed8;
    padding: 7px 14px; border-radius: 5px; font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .btn-main:hover { background: #1d4ed8; }
  .btn-main:disabled { background: #9ca3af; border-color: #6b7280; cursor: wait; }
  .btn-secondary {
    display: inline-block; background: #fff; color: #1f2937; border: 1px solid #d1d5db;
    padding: 7px 12px; border-radius: 5px; font-weight: 600; font-size: 12px; cursor: pointer;
  }
  .btn-secondary:hover { border-color: #2563eb; color: #2563eb; }
  #status { font-size: 12px; color: #6b7280; font-weight: 500; width: 100%; }
  #status[data-state="error"] { color: #b91c1c; }
  #status[data-state="ok"] { color: #15803d; }
</style>
</head>
<body>
  <h1>WVOE — collect in place</h1>
  <h2>
    Fill this next to the LOS — nothing steals its tab. Values sync live to
    <strong>Download PDF</strong> (final output) and to the two-pane page
    behind <strong>Open full-page preview</strong>, the only context switch,
    and it is yours.
  </h2>

  <form id="editor" autocomplete="off">
    <label for="date">Date</label>
    <input id="date" type="text" placeholder="YYYY-MM-DD">

    <label for="verifierBlock">Verifier block (company, attn, loan #)</label>
    <textarea id="verifierBlock" rows="4" placeholder="Verifier&#10;Spuds Lending LLC&#10;Attn: Processing&#10;Loan #123456"></textarea>

    <label for="employerName">Employer name</label>
    <input id="employerName" type="text" placeholder="From the match, or type it">

    <label for="employerContact">Employer contact (address / phone) — optional</label>
    <textarea id="employerContact" rows="3"></textarea>

    <label for="providerBlock">Provider block (provider, code, caveats)</label>
    <textarea id="providerBlock" rows="3"></textarea>

    <label for="employmentTitle">Position / title — optional</label>
    <input id="employmentTitle" type="text">

    <div class="actions">
      <button class="btn-main" id="generate">Download PDF</button>
      <button class="btn-secondary" id="openPreview" type="button">Open full-page preview</button>
      <span id="status" data-state="idle">idle</span>
    </div>
  </form>

  <script src="wvoe-template.js"></script>
  <script src="vendor/pdfme-generator.iife.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
